<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Upload to OpenRouter API - Example</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 30px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="file"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input[type="file"]:focus,
        textarea:focus {
            outline: none;
            border-color: #2a5298;
            background-color: #f9f9f9;
        }

        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input[type="password"]:focus {
            outline: none;
            border-color: #2a5298;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        #imagePreview {
            margin-top: 15px;
            max-height: 300px;
            border-radius: 8px;
            display: none;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        #sendBtn {
            background: linear-gradient(135deg, #2a5298 0%, #1e3c72 100%);
            color: white;
        }

        #sendBtn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(42, 82, 152, 0.4);
        }

        #sendBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #clearBtn {
            background: #f0f0f0;
            color: #333;
        }

        #clearBtn:hover:not(:disabled) {
            background: #e0e0e0;
        }

        .error {
            background-color: #fee;
            border: 2px solid #fcc;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .success {
            background-color: #efe;
            border: 2px solid #cfc;
            color: #3c3;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .response {
            background: #f5f5f5;
            border-left: 4px solid #2a5298;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
            white-space: pre-wrap;
            word-wrap: break-word;
            color: #333;
            font-size: 14px;
            line-height: 1.6;
        }

        .response.visible {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🖼️ Image to AI Analysis</h1>
        <p class="subtitle">Upload an image and ask a question - get AI insights</p>

        <div id="errorContainer" class="error"></div>
        <div id="successContainer" class="success"></div>

        <div class="form-group">
            <label for="apiKey">OpenRouter API Key *</label>
            <input
                type="password"
                id="apiKey"
                placeholder="sk-or-..."
                required
            >
        </div>

        <div class="form-group">
            <label for="imageInput">Select Image (PNG/JPG) *</label>
            <input
                type="file"
                id="imageInput"
                accept="image/png,image/jpeg,.png,.jpg,.jpeg"
                required
            >
            <img id="imagePreview" alt="Image preview">
        </div>

        <div class="form-group">
            <label for="promptInput">Your Question or Prompt *</label>
            <textarea
                id="promptInput"
                placeholder="What would you like to know about this image? (e.g., 'Describe what you see', 'Extract any text', 'Analyze the mood')"
                required
            ></textarea>
        </div>

        <div class="button-group">
            <button id="sendBtn">Send to AI</button>
            <button id="clearBtn" type="button">Clear</button>
        </div>

        <div id="responseContainer" class="response"></div>
    </div>

    <script>
        // Helper function to convert file to base64
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = (error) => reject(error);
            });
        }

        // Validate image format
        function isValidImageFormat(file) {
            const validTypes = ['image/png', 'image/jpeg', 'image/jpg'];
            return validTypes.includes(file.type);
        }

        // Display error message
        function showError(message) {
            const errorContainer = document.getElementById('errorContainer');
            errorContainer.textContent = '❌ ' + message;
            errorContainer.style.display = 'block';
            document.getElementById('successContainer').style.display = 'none';
        }

        // Display success message
        function showSuccess(message) {
            const successContainer = document.getElementById('successContainer');
            successContainer.textContent = '✅ ' + message;
            successContainer.style.display = 'block';
            document.getElementById('errorContainer').style.display = 'none';
        }

        // Clear messages
        function clearMessages() {
            document.getElementById('errorContainer').style.display = 'none';
            document.getElementById('successContainer').style.display = 'none';
        }

        // Handle image preview
        document.getElementById('imageInput').addEventListener('change', (e) => {
            const file = e.target.files?.[0];
            if (file) {
                if (!isValidImageFormat(file)) {
                    showError('Please select a PNG or JPG image.');
                    e.target.value = '';
                    return;
                }
                if (file.size > 5 * 1024 * 1024) {
                    showError('Image file is too large. Maximum size is 5MB.');
                    e.target.value = '';
                    return;
                }
                const reader = new FileReader();
                reader.onload = (event) => {
                    const preview = document.getElementById('imagePreview');
                    preview.src = event.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
                clearMessages();
            }
        });

        // Clear button
        document.getElementById('clearBtn').addEventListener('click', () => {
            document.getElementById('imageInput').value = '';
            document.getElementById('promptInput').value = '';
            document.getElementById('apiKey').value = '';
            document.getElementById('imagePreview').style.display = 'none';
            document.getElementById('responseContainer').innerHTML = '';
            document.getElementById('responseContainer').classList.remove('visible');
            clearMessages();
        });

        // Send button
        document.getElementById('sendBtn').addEventListener('click', async () => {
            clearMessages();

            const apiKey = document.getElementById('apiKey').value.trim();
            const imageInput = document.getElementById('imageInput');
            const prompt = document.getElementById('promptInput').value.trim();
            const sendBtn = document.getElementById('sendBtn');

            // Validation
            if (!apiKey) {
                showError('Please enter your OpenRouter API key.');
                return;
            }

            if (!imageInput.files?.[0]) {
                showError('Please select an image.');
                return;
            }

            if (!prompt) {
                showError('Please enter a prompt or question.');
                return;
            }

            const imageFile = imageInput.files[0];

            // Disable button and show loading state
            sendBtn.disabled = true;
            sendBtn.innerHTML = '<span class="spinner"></span>Processing...';

            try {
                // Convert image to base64
                const base64Image = await fileToBase64(imageFile);

                // Prepare message content with image and text
                const messageContent = [
                    {
                        type: 'text',
                        text: prompt
                    },
                    {
                        type: 'image_url',
                        image_url: {
                            url: base64Image
                        }
                    }
                ];

                // Make API request
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`,
                        'HTTP-Referer': window.location.origin,
                        'X-Title': 'VibeStudy'
                    },
                    body: JSON.stringify({
                        model: 'google/gemini-2.0-flash-001',
                        messages: [
                            {
                                role: 'user',
                                content: messageContent
                            }
                        ],
                        temperature: 0.7,
                        max_tokens: 2000
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(
                        errorData.error?.message ||
                        `API error: ${response.status} ${response.statusText}`
                    );
                }

                const data = await response.json();

                // Extract and display response
                if (data.choices?.[0]?.message?.content) {
                    const responseText = data.choices[0].message.content;
                    document.getElementById('responseContainer').textContent = responseText;
                    document.getElementById('responseContainer').classList.add('visible');
                    showSuccess('Image analyzed successfully!');
                } else {
                    throw new Error('Unexpected API response format');
                }
            } catch (error) {
                console.error('Error:', error);
                showError(error.message || 'Failed to process image. Please try again.');
                document.getElementById('responseContainer').classList.remove('visible');
            } finally {
                // Re-enable button
                sendBtn.disabled = false;
                sendBtn.innerHTML = 'Send to AI';
            }
        });

        // Allow Enter key in textarea to trigger send (Ctrl+Enter)
        document.getElementById('promptInput').addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                document.getElementById('sendBtn').click();
            }
        });
    </script>
</body>
</html>
